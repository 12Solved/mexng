services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    command: ["./scripts/startup.sh"]
    env_file: .env.prod
    volumes:
      # Bind mount (not a named volume) so CHECKPOINT_PATH's poller state
      # survives redeploys AND is directly viewable/editable on the host.
      # First deploy: mkdir -p data && chown 1000:1000 data (matches the
      # fixed mex UID/GID baked into Dockerfile).
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
    environment:
      BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
